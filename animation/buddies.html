<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcripto · ตัวละครผู้พูด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="buddies.css">
  <style>
    body { background: #eef5fd; }
    main { max-width: 1120px; margin: 0 auto; padding: 72px 20px 72px; display: grid; gap: 28px; }
    .intro { display: grid; gap: 10px; }
    .intro h1 { font-family: var(--font-d); font-size: clamp(1.75rem, 1rem + 2.4vw, 2.5rem); line-height: 1.25; }
    .intro p { color: var(--text-2); max-width: 64ch; }
    .grid { display: grid; gap: 18px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card { display: grid; gap: 14px; padding: 20px; border-radius: 24px; background: #fff; box-shadow: inset 0 -5px 0 rgb(10 60 160 / 0.06), 0 6px 0 #d5e3f4, 0 24px 40px -20px rgb(11 50 140 / 0.3); }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .card h2 { font-family: var(--font-d); font-size: 1.35rem; }
    .card h2 small { margin-left: 8px; font-family: var(--font-b); font-size: 0.9rem; font-weight: 500; color: var(--muted); }
    .scene { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 8px; padding: 34px 14px 14px; border-radius: 18px; background: radial-gradient(60% 80% at 50% 110%, #d9eafb, #f4f9ff 70%); overflow: hidden; }
    .who { display: grid; justify-items: center; gap: 8px; }
    .char { width: min(120px, 24vw); aspect-ratio: 1; }
    .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: #fff; font-family: var(--font-d); font-size: 0.8125rem; font-weight: 700; box-shadow: 0 3px 0 #d5e3f4; }
    .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
    .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .controls button, .controls a { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font: 600 0.875rem/1 var(--font-b); color: var(--navy); cursor: pointer; text-decoration: none; transition: background-color 150ms, transform 150ms; }
    .controls button:hover { background: var(--ice); }
    .controls button:active { transform: scale(0.96); }
    .controls button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
    .controls a { margin-left: auto; background: var(--blue); border-color: var(--blue); color: #fff; }
    .controls :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="proto-bar"><a href="a-clay.html">← กลับไปฉาก A</a><span>ตัวละครผู้พูด</span></header>
  <main>
    <div class="intro">
      <h1>ตัวละครผู้พูด — เลือกแบบที่น่ารักที่สุด</h1>
      <p>ทุกแบบมีท่าชุดเดียวกัน: หายใจยุบพอง · กะพริบตา · เด้งเข้าฉาก · พูด (ปากขยับ ตัวเด้ง) · ตกใจตอนถูกเปลี่ยนชื่อ · กระโดดดีใจ แต่ละการ์ดเล่นวนอัตโนมัติ กดปุ่มเพื่อดูทีละท่า หรือกด “ดูในฉาก A” เพื่อเห็นในฉากจริง</p>
    </div>
    <div class="grid" data-grid></div>
  </main>

  <script src="../vendor/gsap.min.js"></script>
  <script src="buddies.js"></script>
  <script>
    (function () {
      var grid = document.querySelector('[data-grid]');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      TXB.STYLES.forEach(function (style) {
        var card = document.createElement('article');
        card.className = 'card';
        card.innerHTML =
          '<div class="card-head"><h2>' + style.name + '<small>' + style.note + '</small></h2></div>' +
          '<div class="scene">' + [1, 2, 3].map(function (n) {
            return '<div class="who s' + n + '"><div class="char">' + TXB.markup(style.id, n - 1) + '</div><span class="tag"><i></i>' + (n === 3 ? '<span data-name>ผู้พูด 3</span>' : 'ผู้พูด ' + n) + '</span></div>';
          }).join('') + '</div>' +
          '<div class="controls">' +
            '<button type="button" data-act="loop" aria-pressed="true">เล่นวนอัตโนมัติ</button>' +
            '<button type="button" data-act="pop">เข้าฉาก</button>' +
            '<button type="button" data-act="talk">พูด</button>' +
            '<button type="button" data-act="react">ตกใจ (เปลี่ยนชื่อ)</button>' +
            '<button type="button" data-act="cheer">ดีใจ</button>' +
            '<a href="a-clay.html?buddy=' + style.id + '">ดูในฉาก A →</a>' +
          '</div>';
        grid.appendChild(card);

        var chars = Array.prototype.slice.call(card.querySelectorAll('.char'));
        chars.forEach(TXB.init);
        var name = card.querySelector('[data-name]');
        var loopBtn = card.querySelector('[data-act="loop"]');
        if (reduce) { loopBtn.setAttribute('aria-pressed', 'false'); return; }

        var loop = gsap.timeline({ repeat: -1, repeatDelay: 0.9 });
        chars.forEach(function (c, i) { TXB.pop(loop, c, 0.2 + i * 0.16); });
        chars.forEach(function (c, i) { TXB.talk(loop, c, 1.3 + i * 1.4, 1.1); });
        loop.call(function () { name.textContent = 'ผู้พูด 3'; }, null, 0);
        TXB.react(loop, chars[2], 5.7);
        loop.call(function () { name.textContent = 'คุณมาลี'; }, null, 5.85);
        chars.forEach(function (c, i) { TXB.cheer(loop, c, 6.9 + i * 0.12); });
        loop.to({}, { duration: 0.4 }, 7.8);

        var shot = null;
        function stopLoop() {
          loop.pause();
          loop.time(loop.duration());
          loopBtn.setAttribute('aria-pressed', 'false');
        }
        card.addEventListener('click', function (e) {
          var btn = e.target.closest('button[data-act]');
          if (!btn) return;
          var act = btn.dataset.act;
          if (shot) shot.progress(1).kill();
          if (act === 'loop') {
            var on = btn.getAttribute('aria-pressed') !== 'true';
            btn.setAttribute('aria-pressed', String(on));
            if (on) loop.restart(); else stopLoop();
            return;
          }
          stopLoop();
          shot = gsap.timeline();
          if (act === 'pop') chars.forEach(function (c, i) { TXB.pop(shot, c, i * 0.14); });
          if (act === 'talk') chars.forEach(function (c, i) { TXB.talk(shot, c, i * 1.2, 1); });
          if (act === 'react') { TXB.react(shot, chars[2], 0); shot.call(function () { name.textContent = name.textContent === 'คุณมาลี' ? 'ผู้พูด 3' : 'คุณมาลี'; }, null, 0.15); }
          if (act === 'cheer') chars.forEach(function (c, i) { TXB.cheer(shot, c, i * 0.12); });
        });
      });
    })();
  </script>
</body>
</html>
