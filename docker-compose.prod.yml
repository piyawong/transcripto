version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: always

  backend:
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    restart: always

  celery:
    command: celery -A core worker -l info --concurrency=4
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
    restart: always

  frontend:
    command: npm start
    restart: always

  redis:
    restart: always

  db:
    restart: always